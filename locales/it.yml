Settings_GridShowNote: Con Anteprime vedi un'immagine di ogni scheda, con Icone solo l'icona del sito.
Settings_Compact: Compatto
Settings_CompactNote: Righe più basse, così entrano più schede.
Settings_ListRows: Schede visibili senza scorrere
