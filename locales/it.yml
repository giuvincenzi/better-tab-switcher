Settings_Scope: Mostra le schede di
Settings_ScopeWindow: Questa finestra
Settings_ScopeAll: Tutte le finestre
Settings_ScopeNote: Con Tutte le finestre, le schede delle altre finestre mostrano il numero della finestra in cui si trovano.
Settings_ShowPinned: Mostra le schede fissate
Settings_Delay: Attesa prima che compaia il selettore
Settings_DelayNote: Se premi e rilasci la scorciatoia prima di questo tempo, passi alla scheda precedente senza vedere il selettore.
Settings_StayOpen: Resta aperto finché non scegli una scheda
Settings_StayOpenNote: Quando rilasci i tasti della scorciatoia non cambi scheda. Scegli la scheda con Invio o con un clic.
Settings_ChromePagesWindow: Apri il selettore in una finestra sulle pagine di $1
Settings_ChromePagesWindowNote: $1 non permette alle estensioni di funzionare nelle sue pagine, come Impostazioni, né nel suo store di estensioni, $2. Lì il selettore si apre in una piccola finestra separata.
Settings_AutoSelect: Selezione automatica
Settings_AutoSelectNote: La scheda selezionata si apre dopo qualche secondo. Una linea mostra il tempo che manca.
Settings_AutoSelectTime: Tempo per la selezione automatica
Settings_TabDetails: Dettagli delle schede
Settings_Address: Indirizzo del sito web
Settings_LongAddress: Indirizzi web lunghi
Settings_LongAddressNote: Si possono accorciare con “…” oppure far scorrere sulla scheda selezionata per vederli per intero.
