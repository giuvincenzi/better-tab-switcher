Settings_StayOpen: Rămâne deschis până alegi o filă
Settings_StayOpenNote: Când eliberezi tastele comenzii rapide, fila nu se schimbă. Alege o filă cu Enter sau cu un clic.
Settings_ChromePagesWindow: Deschide comutatorul într-o fereastră pe paginile $1
Settings_ChromePagesWindowNote: $1 nu permite extensiilor să acceseze paginile proprii, cum ar fi Setări, și nici magazinul său de extensii, $2. Acolo, comutatorul se deschide într-o fereastră mică separată.
