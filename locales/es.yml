Settings_Restore: Restaurar
Settings_RestoreTitle: ¿Restaurar los valores predeterminados?
Settings_RestoreText: Toda la configuración vuelve a estar como cuando instalaste Better Tab Switcher. Tus combinaciones de teclas no cambian.
Settings_Search: Buscar en la configuración
Settings_ClearSearch: Borrar búsqueda
Settings_NoResults: Ningún ajuste coincide con tu búsqueda.
Settings_NoResultsNote: Prueba con otras palabras o borra la búsqueda para ver todos los ajustes.
