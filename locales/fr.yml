Settings_Toolbar: Afficher la barre d'outils
Settings_ToolbarNote: Une barre en haut du sélecteur, avec le champ de recherche et des boutons pour l'affichage et les paramètres.
Settings_GridShow: Afficher
Settings_GridShowPreviews: Aperçus
Settings_GridShowIcons: Icônes
Settings_GridShowNote: Aperçus montre une image de chaque onglet. Icônes montre seulement l'icône de chaque site.
Settings_Compact: Compact
Settings_CompactNote: Des lignes moins hautes, pour voir plus d'onglets à la fois.
Settings_ListRows: Onglets visibles sans faire défiler
Settings_RowsFit: Adapter à l'écran
Settings_RowsFitNote: Adapter à l'écran affiche autant d'onglets que la hauteur de l'écran le permet.
Settings_Switching: Changement d'onglet
Settings_Scope: Afficher les onglets de
Settings_ScopeWindow: Cette fenêtre
Settings_ScopeAll: Toutes les fenêtres
Settings_ScopeNote: Avec toutes les fenêtres, les onglets des autres fenêtres indiquent le numéro de leur fenêtre.
Settings_ShowPinned: Afficher les onglets épinglés
Settings_Delay: Délai avant l'affichage du sélecteur
Settings_DelayNote: Un appui plus bref passe à l'onglet précédent sans afficher le sélecteur.
Settings_StayOpen: Rester ouvert jusqu'au choix d'un onglet
Settings_StayOpenNote: Relâcher les touches du raccourci ne change pas d'onglet. Choisissez un onglet avec Entrée ou d'un clic.
Settings_ChromePagesWindow: Utiliser une fenêtre sur les pages de $1
Settings_ChromePagesWindowNote: $1 n'autorise pas les extensions sur ses propres pages, comme les Paramètres, ni sur sa boutique d'extensions. Sur ces pages, le sélecteur s'ouvre dans une petite fenêtre à part.
Settings_AutoSelect: Sélection automatique
Settings_AutoSelectNote: L'onglet sélectionné s'ouvre au bout de quelques secondes. Une ligne indique le temps restant.
Settings_AutoSelectTime: Délai de sélection automatique
Settings_TabDetails: Détails des onglets
Settings_Address: Adresse du site web
Settings_LongAddress: Adresses trop longues
Settings_LongAddressNote: Ou les faire défiler sur l'onglet sélectionné.
Settings_LongAddressCut: Tronquer
Settings_LongAddressScroll: Faire défiler
Settings_PinnedIcon: Icône des onglets épinglés
Settings_AudioIcon: Icône de lecture audio
Settings_Sleeping: Onglets en veille
Settings_SleepingNote: Les onglets en veille ont une icône et s'affichent en gris.
Settings_GroupColor: Couleur du groupe d'onglets
Settings_LastUsed: Dernière utilisation
Settings_LastUsedNote: Par exemple, $1.
Settings_Shortcuts: Raccourcis clavier
Settings_ShortcutsNote: $1 ne permet pas aux extensions d'utiliser Ctrl+Tab.
Settings_ShortcutsGuide: Comment utiliser Ctrl+Tab
