Extension_Description: ショートカット1つでタブを一覧表示。すばやく切り替え・検索したり、閉じたりできます。表示形式は自由に選べて、プライバシーも安心です。
Language_Tag: ja
Browser_ChromeStore: Chrome ウェブストア
Browser_EdgeStore: Microsoft Edge アドオン
Command_NextTab: 次のタブを選択した状態で切り替え画面を開く
Command_PreviousTab: 前のタブを選択した状態で切り替え画面を開く
Switcher_Tabs: 開いているタブ（最近使用した順）
Switcher_Toolbar: ツールバー
Switcher_Search: タブを検索
Switcher_NoMatch: 検索に一致するタブはありません。
Switcher_Settings: すべての設定
Switcher_CloseTab: タブを閉じる
Switcher_Pinned: 固定タブ
Switcher_PlayingAudio: 音声を再生中
Switcher_Sleeping: アクティブでないタブ
Switcher_Window: ウィンドウ $1
Switcher_New: 未読
Switcher_NotOpened: まだ開いていません
Switcher_CopyAddress: アドレスをコピー
Switcher_AddressCopied: アドレスをコピーしました
Switcher_CopyFailed: アドレスをコピーできませんでした
Settings_Title: Better Tab Switcher の設定
Settings_Sections: 設定のセクション
Settings_Appearance: デザイン
Settings_Theme: テーマ
Settings_ThemeDevice: デバイスのテーマ
Settings_ThemeLight: ライト
Settings_ThemeDark: ダーク
Settings_View: 表示形式
Settings_ViewList: リスト
Settings_ViewGrid: グリッド
Settings_Toolbar: ツールバーを表示
Settings_ToolbarNote: 切り替え画面の上部に表示されるバーで、検索欄と、表示形式や設定のボタンがあります。
Settings_GridShow: 表示内容
Settings_GridShowPreviews: プレビュー
Settings_GridShowIcons: アイコン
Settings_GridShowNote: 「プレビュー」では各タブの画像を、「アイコン」では各サイトのアイコンだけを表示します。
Settings_Compact: コンパクト
Settings_CompactNote: 行の高さを抑えて、より多くのタブを表示します。
Settings_ListRows: スクロールせずに表示するタブの数
Settings_RowsFit: 画面に合わせる
Settings_RowsFitNote: 「画面に合わせる」では、画面の高さに収まるだけのタブを表示します。
Settings_Switching: 切り替え
Settings_Scope: 表示するタブの範囲
Settings_ScopeWindow: このウィンドウ
Settings_ScopeAll: すべてのウィンドウ
Settings_ScopeNote: 「すべてのウィンドウ」では、別のウィンドウにあるタブにそのウィンドウの番号が表示されます。
Settings_ShowPinned: 固定タブを表示
Settings_Delay: 切り替え画面が表示されるまでの時間
Settings_DelayNote: ショートカットをこれより素早く押して離すと、切り替え画面を表示せずに直前のタブに切り替わります。
Settings_StayOpen: タブを選ぶまで開いたままにする
Settings_StayOpenNote: ショートカットのキーを離してもタブは切り替わりません。Enter キーまたはクリックでタブを選んでください。
Settings_ChromePagesWindow: $1 のページでは切り替え画面を別のウィンドウで開く
Settings_ChromePagesWindowNote: $1 では、設定などのブラウザ自体のページや拡張機能ストア（$2）で拡張機能を使用できません。そうしたページでは、切り替え画面が専用の小さなウィンドウで開きます。
Settings_AutoSelect: 自動選択
Settings_AutoSelectNote: 選択中のタブが数秒後に開きます。残り時間は線で表示されます。
Settings_AutoSelectTime: 自動選択までの時間
Settings_TabDetails: タブの詳細
Settings_Address: ウェブサイトのアドレス
Settings_FullAddress: アドレス全体
Settings_FullAddressNote: サイトだけでなく、ページのアドレス全体を表示します。
Settings_LongAddress: 長いウェブサイトのアドレス
Settings_LongAddressNote: 選択中のタブとカーソルを合わせたタブではスクロールして全体を表示するか、「…」で省略します。
Settings_LongAddressCut: 省略する
Settings_LongAddressScroll: スクロールする
Settings_PinnedIcon: 固定タブのアイコン
Settings_AudioIcon: 音声再生中のアイコン
Settings_Sleeping: アクティブでないタブ
Settings_SleepingNote: アクティブでないタブにはアイコンが付き、グレーで表示されます。
Settings_GroupColor: タブグループの色
Settings_LastUsed: 最後に使用した時間
Settings_LastUsedNote: 「$1」のように表示されます。
Settings_NotOpened: まだ開いていないタブ
Settings_NotOpenedNote: バックグラウンドで開いたタブには、表示するまで「$1」と表示されます。
Settings_CopyAddress: "「アドレスをコピー」ボタン"
Settings_CopyAddressNote: カーソルを合わせたタブに、ウェブサイトのアドレスをコピーするボタンが表示されます。
Settings_Shortcuts: キーボード ショートカット
Settings_ShortcutsNote: $1 では、拡張機能で Ctrl+Tab を使用できません。
Settings_ShortcutsGuide: Ctrl+Tab を使う方法
Settings_NextTab: 次のタブ
Settings_NextTabNote: 切り替え画面を開き、次のタブを選択します。
Settings_PreviousTab: 前のタブ
Settings_PreviousTabNote: 切り替え画面を開き、前のタブを選択します。
Settings_ChangeShortcut: ショートカットを変更
Settings_NoShortcut: 未設定
Settings_IconShortcut: ツールバーのアイコン
Settings_IconShortcutNote: ツールバーのアイコンをクリックしたときと同じように、切り替え画面を開きます。タブを選ぶまで開いたままになります。
Settings_ShortcutMissing: キーが設定されていないショートカットがあります。別の拡張機能がすでにそのキーを使用している可能性があります。「$1」で好きなキーを設定してください。
Settings_ShortcutsDialogTitle: キーボード ショートカットの設定
Settings_ShortcutsDialogText: Better Tab Switcher がインストールされました。開くときに使うキーを選んでください。
Settings_Reset: リセット
Settings_RestoreDefaults: 設定を元の既定値に戻す
Settings_Restore: リセット
Settings_RestoreTitle: 設定を元の既定値に戻しますか？
Settings_RestoreText: すべての設定が、Better Tab Switcher をインストールしたときの状態に戻ります。キーボード ショートカットは変更されません。
Settings_Search: 設定項目を検索
Settings_ClearSearch: 検索をクリア
Settings_NoResults: 検索に一致する設定はありません。
Settings_NoResultsNote: 別の言葉で検索するか、検索をクリアしてすべての設定を表示してください。
Settings_Menu: メインメニュー
Settings_About: Better Tab Switcher について
Settings_Version: バージョン $1
Settings_CheckUpdates: アップデートを確認
Settings_Checking: アップデートを確認しています…
Settings_UpToDate: Better Tab Switcher は最新版です。
Settings_UpdateReady: バージョン $1 の準備ができました。今すぐ使うには Better Tab Switcher を再起動してください。
Settings_UpdateReadyNoVersion: 新しいバージョンの準備ができました。今すぐ使うには Better Tab Switcher を再起動してください。
Settings_Restart: 再起動
Settings_UpdateLater: $1 はたった今アップデートを確認しました。数分後にもう一度お試しください。
Settings_UpdateFailed: Better Tab Switcher はアップデートを確認できませんでした。しばらくしてからもう一度お試しください。
Settings_WhatsNew: 新機能
Settings_WhatsNewNote: バージョン $1 の変更内容を確認できます。
Settings_Guide: ユーザーガイド
Settings_GuideNote: 切り替え画面の使い方と、各設定でできること。
Settings_ReportIssue: 問題を報告
Settings_ReportIssueNote: バグの報告やアイデアの提案は GitHub でお知らせください。
Settings_Website: ウェブサイト
Settings_Rate: この拡張機能を評価
Settings_RateNote: 拡張機能ストア（$1）でレビューを書いてください。
Settings_Star: GitHub でスターを付ける
Settings_StarNote: Better Tab Switcher を気に入っていただけたら、GitHub でスターを付けてください。
Dialog_Done: 完了
Dialog_Cancel: キャンセル
