name: Bug report
description: Something in Better Tab Switcher does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happens
      description: What goes wrong, and where in Better Tab Switcher.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What to do, step by step, to see it happen.
      placeholder: |
        1. Open …
        2. Press …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Better Tab Switcher version
      description: Shown in chrome://extensions, under the extension's name.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 156 on Windows 11
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots
      description: Drag screenshots here.
