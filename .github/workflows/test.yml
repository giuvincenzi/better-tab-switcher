# The tests: lint and types, unit tests (unit_test, like `make lint` and `make test`) and end-to-end tests (like
# `make e2e`). The required checks for merging into main are unit_test and e2e_test.
# Starts on:
#   - every pull request (each push to its branch) and every push to main;
#   - workflow_dispatch: `gh workflow run test.yml --ref <branch>`, to run the tests on a branch;
#   - workflow_call: publish_release runs it before publishing (job run_tests).
# decide_which_tests_run looks once at the changed files and tells which checks can change their result, each from the
# files it reads (testing.md): lint and types, unit tests, end-to-end tests. A check that is not needed doesn't run, and
# a skipped job counts as passing for a required check. Called by publish_release or started by hand, everything runs.
# Every check runs once: lint and types only in unit_test, the extension is built only in build_extension.
# The end-to-end tests run on every system of E2E_SYSTEMS, in E2E_GROUPS groups each, every group on its own machine
# at the same time (e2e_<system>_group_<n>), split by Playwright's --shard; e2e_test checks that on every system each
# test ran once and passed (testing.md, "End-to-end tests in groups").
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  E2E_GROUPS: 2 # how many machines run the end-to-end tests at once on each system: change only this (testing.md)
  # The systems the end-to-end tests run on, name:runner (GitHub's machines): change only this.
  E2E_SYSTEMS: linux:ubuntu-latest windows:windows-latest macos:macos-latest

jobs:
  decide_which_tests_run:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.decide.outputs.lint }}
      unit: ${{ steps.decide.outputs.unit }}
      e2e: ${{ steps.decide.outputs.e2e }}
      e2e_groups: ${{ steps.matrix.outputs.e2e_groups }}
      e2e_systems: ${{ steps.matrix.outputs.e2e_systems }}
    steps:
      - name: checkout_code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed files: the diff of the pull request or of the push

      - name: choose_tests_from_changed_files
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          # Called by publish_release, github.workflow is the caller's: everything runs; started by hand, everything.
          range=()
          if [ "$WORKFLOW" = test ]; then
            case "$EVENT" in
              pull_request) range=(HEAD^1 HEAD) ;;
              push) range=("$BEFORE" "$GITHUB_SHA") ;;
            esac
          fi
          lint=true
          unit=true
          e2e=true
          if [ ${#range[@]} -gt 0 ] && files=$(git diff --name-only "${range[@]}"); then
            # Each check runs when a file it reads changed (testing.md, "Which changes run the tests on GitHub").
            # Lint and types: the kinds of file Biome checks (biome.json: all but Markdown, and only the kinds it knows)
            # and tsc a part of them. The tests: the files the build of the extension reads, their own files and this
            # workflow.
            lintable='\.(ts|tsx|js|mjs|cjs|json|jsonc|css|ya?ml|html|svg)$'
            build='^(entrypoints/|components/|lib/|styles/|locales/|public/|wxt\.config\.ts$|tsconfig\.json$|package(-lock)?\.json$|\.tool-versions$|\.gitattributes$|\.github/workflows/test\.yml$)'
            lint=false
            unit=false
            e2e=false
            if grep -qE "$lintable" <<< "$files"; then lint=true; fi
            if grep -qE "$build|^tests/unit/|^vitest\.config\.ts$" <<< "$files"; then unit=true; fi
            if grep -qE "$build|^tests/e2e/|^playwright\.config\.ts$" <<< "$files"; then e2e=true; fi
            # The merge of a release pull request (the version in package.json changed): publish_release runs
            # everything on this commit.
            version() { git show "$1:package.json" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0)).version' 2>/dev/null; }
            if [ "$EVENT" = push ] && [ "$(version "$BEFORE")" != "$(version "$GITHUB_SHA")" ]; then
              lint=false
              unit=false
              e2e=false
            fi
          fi
          {
            echo "lint=$lint"
            echo "unit=$unit"
            echo "e2e=$e2e"
          } >> "$GITHUB_OUTPUT"
          echo "Lint and types: $lint. Unit tests: $unit. End-to-end tests: $e2e (testing.md)." >> "$GITHUB_STEP_SUMMARY"

      # E2E_GROUPS (2) -> [1,2] and E2E_SYSTEMS -> [{"name":"linux","runner":"ubuntu-latest"}, ...], the matrix of
      # e2e_group: a matrix cannot read env, so both are written once at the top and turned into lists here.
      - name: list_e2e_matrix
        id: matrix
        run: |
          if ! [[ "$E2E_GROUPS" =~ ^[1-9][0-9]*$ ]]; then echo "::error::E2E_GROUPS must be a number from 1: '$E2E_GROUPS'."; exit 1; fi
          echo "e2e_groups=[$(seq -s, 1 "$E2E_GROUPS")]" >> "$GITHUB_OUTPUT"
          systems=()
          for system in $E2E_SYSTEMS; do
            if ! [[ "$system" =~ ^[a-z]+:[a-z0-9.-]+$ ]]; then echo "::error::E2E_SYSTEMS takes name:runner pairs: '$system'."; exit 1; fi
            systems+=("{\"name\":\"${system%%:*}\",\"runner\":\"${system#*:}\"}")
          done
          echo "e2e_systems=[$(IFS=,; echo "${systems[*]}")]" >> "$GITHUB_OUTPUT"

  # Lint and types (when a file they read changed) and the unit tests (when a file they read changed). Red when
  # decide_which_tests_run failed: nobody knows then what had to run.
  unit_test:
    needs: decide_which_tests_run
    if: >-
      !cancelled() && (needs.decide_which_tests_run.result != 'success' ||
      needs.decide_which_tests_run.outputs.lint == 'true' || needs.decide_which_tests_run.outputs.unit == 'true')
    runs-on: ubuntu-latest
    env:
      DECIDE: ${{ needs.decide_which_tests_run.result }}
      LINT: ${{ needs.decide_which_tests_run.outputs.lint }}
      UNIT: ${{ needs.decide_which_tests_run.outputs.unit }}
    steps:
      - name: stop_if_undecided
        if: env.DECIDE != 'success'
        run: |
          echo "::error::decide_which_tests_run did not finish: the checks to run are unknown."
          exit 1

      - name: checkout_code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # block_version_change compares with the pull request's base

      # Only a release pull request (branch release/X.Y.Z, opened by create_release_pr) changes the version: merging it
      # publishes the release (publish_release starts when the version in package.json changes on main).
      - name: block_version_change
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          version() { git show "$1:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version'; }
          if [ "$(version HEAD^1)" != "$(version HEAD)" ]; then
            echo "::error file=package.json::Only the release pull request (create_release_pr) changes the version: merging it publishes a release."
            exit 1
          fi

      - name: install_node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: install_dependencies
        run: npm ci

      - name: check_lint_and_types
        if: env.LINT == 'true'
        run: npm run lint

      # The components' unit tests run in Playwright's Chromium.
      - name: install_chromium
        if: env.UNIT == 'true'
        run: npx playwright install --with-deps chromium

      - name: run_unit_tests
        if: env.UNIT == 'true'
        run: npm test

  # The extension, built once for every end-to-end group: the published build, whose manifest the tests check, and the
  # test build (the published one plus the hook the tests open the switcher with). The same files on every system.
  build_extension:
    needs: decide_which_tests_run
    if: needs.decide_which_tests_run.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout_code
        uses: actions/checkout@v7

      - name: install_node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: install_dependencies
        run: npm ci

      - name: build_extension
        run: npx wxt build && npx wxt build --mode e2e

      - name: save_builds
        uses: actions/upload-artifact@v7
        with:
          name: extension_builds
          path: |
            .output/chrome-mv3/
            .output/chrome-mv3-e2e/
          retention-days: 1

  # One copy per system and group (e2e_linux_group_1 ... e2e_macos_group_N), at the same time, each on its own machine.
  e2e_group:
    name: e2e_${{ matrix.system.name }}_group_${{ matrix.group }}
    needs: [decide_which_tests_run, build_extension]
    if: needs.decide_which_tests_run.outputs.e2e == 'true'
    strategy:
      fail-fast: false # a failing group does not stop the others: every broken test shows
      matrix:
        system: ${{ fromJSON(needs.decide_which_tests_run.outputs.e2e_systems) }}
        group: ${{ fromJSON(needs.decide_which_tests_run.outputs.e2e_groups) }}
    runs-on: ${{ matrix.system.runner }}
    defaults:
      run:
        shell: bash # the same commands on Windows too (Git Bash)
    env:
      SYSTEM: ${{ matrix.system.name }}
      GROUP: ${{ matrix.group }}
    steps:
      - name: checkout_code
        uses: actions/checkout@v7

      - name: install_node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: install_dependencies
        run: npm ci

      # Playwright's Chromium for this system; on Linux also the system libraries it needs.
      - name: install_chromium
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: get_builds
        uses: actions/download-artifact@v8
        with:
          name: extension_builds
          path: .output

      # Every end-to-end test, as Playwright lists it: the same list on every machine.
      - name: list_e2e_tests
        run: |
          mkdir -p e2e_results
          npx playwright test --list --reporter=json > e2e_results/all_tests.json

      - name: run_group_tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e_results/group_${{ matrix.group }}.json
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e_results/report
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --shard="$GROUP/$E2E_GROUPS" --reporter=list,json,html --output=e2e_results/tests

      # README.txt: what each file of the artifact is and how it helps investigate a failed test. The one description
      # of the artifact: testing.md points here.
      - name: describe_group_result
        if: always()
        run: |
          mkdir -p e2e_results
          cat > e2e_results/README.txt <<'EOF'
          Better Tab Switcher end-to-end tests: one group's results on one system
          ======================================================================

          This artifact holds what one group of the end-to-end tests did on one GitHub machine (a "runner") of one
          system. The test workflow (.github/workflows/test.yml) runs the end-to-end tests on every system of
          E2E_SYSTEMS (Linux, Windows, macOS) and splits them on each into E2E_GROUPS groups with Playwright's --shard;
          they run at the same time on different machines. This README is written by the step describe_group_result
          of that workflow.

          Artifact name: e2e_<system>_group_<n>_attempt_<a>
            <system>  linux, windows or macos: the system the tests ran on.
            <n>       the group's number, from 1 to E2E_GROUPS.
            <a>       the run's attempt (github.run_attempt): 1 for the first run; "Re-run failed jobs" runs the failed
                      groups again as attempt 2, 3, ..., each with an artifact of its own next to the older ones. The
                      job e2e_test checks each group's newest attempt.

          Files
          -----
          all_tests.json
            Every end-to-end test of the project, as `playwright test --list --reporter=json` lists it. Every group
            writes the same file; e2e_test checks they are equal.

          group_<n>.json
            The test report of this group (Playwright's JSON reporter): every test that ran, with its status, duration
            and errors. Missing: the tests did not run.

          report/
            The same results as a web page (Playwright's HTML report): open report/index.html in a browser. Every test
            shows its steps, its screenshot and its trace; a failed one also its error.

          tests/
            Playwright's output, a folder for each test that ran: the screenshot at its end (test-finished-1.png when
            it passed, test-failed-1.png when it failed) and its trace (trace.zip). Open a trace with
            `npx playwright show-trace trace.zip`: every step of the test, with the page as it was at each one.

          Investigating a failed test
          ---------------------------
          Start from the test itself: its code (tests/e2e/<file>.spec.ts), what it does and what it expects, and the
          line that failed (in the job's log, step run_group_tests, or in e2e_test's summary). Then the trace shows what
          the browser did at each step, and the screenshot what was on the page when it failed. A test that fails on one
          system only: compare with the same test's screenshot and trace on another system. Fix the cause, not the wait.
          EOF

      # Also when tests failed: e2e_test needs every group's list and report. The name has the run's attempt: after a
      # "Re-run failed jobs" the group's new artifact does not mix with the failed one (e2e_test reads the newest).
      - name: save_group_result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e_${{ matrix.system.name }}_group_${{ matrix.group }}_attempt_${{ github.run_attempt }}
          path: e2e_results/
          retention-days: 7

  # The required check: green only when on every system every end-to-end test ran exactly once and passed, or when
  # none was needed.
  e2e_test:
    needs: [decide_which_tests_run, e2e_group]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: skip_if_not_needed
        id: needed
        env:
          DECIDE: ${{ needs.decide_which_tests_run.result }}
          E2E: ${{ needs.decide_which_tests_run.outputs.e2e }}
        run: |
          if [ "$DECIDE" != success ]; then echo "::error::decide_which_tests_run did not finish."; exit 1; fi
          if [ "$E2E" != true ]; then echo "End-to-end tests not needed: no changed file can change their result." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "run=$E2E" >> "$GITHUB_OUTPUT"

      - name: collect_group_results
        if: steps.needed.outputs.run == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: e2e_*_group_*
          path: e2e_results # one folder per artifact: e2e_<system>_group_<n>_attempt_<a>

      # On every system, for each group its newest attempt (a re-run group has a newer one, a passed group keeps its
      # first), then: (1) every group of every system saw the same list, (2) on every system every test ran exactly
      # once (none missing, none twice), (3) every test and every group passed.
      - name: check_every_test_ran_once
        if: steps.needed.outputs.run == 'true'
        env:
          GROUPS_RESULT: ${{ needs.e2e_group.result }}
        shell: python3 {0}
        run: |
          import json, os, pathlib, sys

          def tests(suite, titles=()):
              """Every test of a Playwright JSON report, by its file and titles, with its results."""
              names = titles + ((suite["title"],) if suite.get("title") else ())
              for spec in suite.get("specs", []):
                  for test in spec.get("tests", []):
                      yield " › ".join(names + (spec["title"],)), test.get("results", [])
              for child in suite.get("suites", []):
                  yield from tests(child, names)

          def report_tests(path):
              return [t for suite in json.loads(path.read_text())["suites"] for t in tests(suite)]

          systems = [pair.split(":")[0] for pair in os.environ["E2E_SYSTEMS"].split()]
          groups = int(os.environ["E2E_GROUPS"])
          root = pathlib.Path("e2e_results")
          problems, failed, lists, counts = [], [], set(), []
          for system in systems:
              ran = {}
              for g in range(1, groups + 1):
                  group = f"e2e_{system}_group_{g}"
                  attempts = sorted(root.glob(f"{group}_attempt_*"), key=lambda p: int(p.name.rsplit("_", 1)[1]))
                  if not attempts or not (attempts[-1] / "all_tests.json").exists():
                      problems.append(f"{group}: no results (it did not get as far as listing the tests).")
                      continue
                  folder = attempts[-1]
                  print(f"{group}: {folder.name}")
                  lists.add("\n".join(sorted(name for name, _ in report_tests(folder / "all_tests.json"))))
                  report = folder / f"group_{g}.json"
                  if not report.exists():
                      problems.append(f"{group}: no test report (the tests did not run).")
                      continue
                  for name, results in report_tests(report):
                      ran.setdefault(name, []).append(g)
                      status = results[-1]["status"] if results else "not run"
                      if status != "passed":
                          failed.append(f"{name} ({status}, {group})")
              counts.append((system, ran))
          if len(lists) > 1:
              problems.append("The groups did not see the same list of tests.")
          everything = [t for t in (lists.pop() if len(lists) == 1 else "").split("\n") if t]
          for system, ran in counts:
              for name in everything:
                  if name not in ran:
                      problems.append(f"{name}: ran in no group on {system}.")
              for name, where in ran.items():
                  if len(where) > 1:
                      groups_text = ", ".join(f"e2e_{system}_group_{g}" for g in where)
                      problems.append(f"{name}: ran in more than one group on {system} ({groups_text}).")
          if os.environ["GROUPS_RESULT"] != "success":
              problems.append(f"The groups' result is '{os.environ['GROUPS_RESULT']}'.")
          summary = [
              f"End-to-end tests: {len(everything)} on {len(systems)} systems ({', '.join(systems)}), "
              f"{groups} groups each, {len(failed)} failed."
          ]
          summary += [f"- Failed: {f}" for f in failed] + [f"- {p}" for p in problems]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          if failed or problems:
              sys.exit(1)
