# Temporary experiment: can Playwright load the extension in Microsoft Edge on Linux, Windows and macOS?
# (.github/edge-experiment/run.mjs). Removed once the result is known.
name: edge_experiment

on:
  pull_request:

permissions:
  contents: read

jobs:
  try_edge:
    name: try_edge_${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout_code
        uses: actions/checkout@v7

      - name: install_node
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: install_dependencies
        run: npm ci

      - name: build_extension
        run: npx wxt build --mode e2e

      - name: install_browsers
        run: |
          npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} --no-shell chromium
          npx playwright install msedge || echo "Edge: playwright install msedge failed, using the Edge already on the machine"

      - name: try_edge
        run: node .github/edge-experiment/run.mjs
